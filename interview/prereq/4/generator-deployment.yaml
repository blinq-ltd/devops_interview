apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetic-generator
  namespace: observability
  labels:
    app: synthetic-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synthetic-generator
  template:
    metadata:
      labels:
        app: synthetic-generator
    spec:
      containers:
        - name: generator
          image: 382163918348.dkr.ecr.us-east-1.amazonaws.com/devops-interview-generator:v2
          env:
            - name: REQUEST_INTERVAL_SECONDS
              value: "1"
          ports:
            - containerPort: 9090
              name: metrics
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
