# SingleBinary deployment mode - simplest viable Loki for a lab, filesystem
# storage (no S3/GCS backend needed). Not representative of a real
# production multi-tenant Loki, which is explicitly discussion-only for
# this scenario per the original interview guide.
deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 512Mi }
  persistence:
    enabled: true
    storageClass: gp3
    size: 5Gi

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 24h

# Disable the extra components SingleBinary mode doesn't need.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false

gateway:
  resources:
    requests: { cpu: 20m, memory: 32Mi }

test:
  enabled: false
lokiCanary:
  enabled: false
